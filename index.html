<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAS LAB · Simulador de gases ideales</title>
<style>
:root{--c:#2563eb;--bg:#f5f7fa;--ink:#1c2430;--mut:#5b6675;--line:#dde3ea;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.45}
header{padding:14px 20px;background:#fff;border-bottom:3px solid var(--c);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.4rem;letter-spacing:.5px}h1 small{display:block;font-size:.75rem;font-weight:400;color:var(--mut)}
.modes button{border:1px solid var(--line);background:#fff;padding:7px 14px;cursor:pointer;font:inherit}
.modes button:first-child{border-radius:8px 0 0 8px}.modes button:last-child{border-radius:0 8px 8px 0}
.modes button.on{background:var(--c);color:#fff;border-color:var(--c)}
.app{display:grid;grid-template-columns:210px 1fr;gap:14px;padding:14px;max-width:1300px;margin:auto}
nav{display:flex;flex-direction:column;gap:6px}
nav button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-left:6px solid var(--k);background:#fff;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--k);color:#fff}
.main{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 8px;font-size:1.05rem;color:var(--c)}h4{margin:12px 0 4px}
canvas{width:100%;height:auto;background:#fbfcfe;border-radius:8px;border:1px solid var(--line);display:block}
.row{display:grid;grid-template-columns:44px 1fr 86px;gap:6px;margin:5px 0;align-items:center}
.row.g{grid-template-columns:1fr 90px 36px}
input,select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;width:100%;min-width:0}
input:disabled{background:#eef1f5;color:var(--mut)}
.go,.sm{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;margin:8px 8px 0 0}
.sm{background:#fff;color:var(--c);border:1px solid var(--c);padding:6px 10px}
.const{background:#eef3ff;border-left:4px solid var(--c);padding:6px 10px;margin:0 0 8px;font-size:.92rem}
.err{background:#fdecec;border-left:4px solid #c62828;padding:10px;color:#7f1d1d;border-radius:6px}
.step{border-bottom:1px solid var(--line);padding:6px 0}.step b{color:var(--c)}.step div{font-family:Consolas,monospace;font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}
.res{font-size:1.35rem;font-weight:700;color:var(--c)}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--line);padding:5px;text-align:right}th{background:#eef1f5}
.note{color:var(--mut);font-size:.85rem}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}.main{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>GAS LAB<small>Simulador de propiedades de los gases ideales</small></h1>
<div class="modes" id="modes"><button data-m="guided" class="on">Modo guiado</button><button data-m="free">Modo libre</button></div></header>
<div class="app"><nav id="menu" aria-label="Experimentos"></nav>
<div class="main"><div class="col"><div class="card"><h2 id="ttl"></h2><canvas id="cv" width="520" height="340"></canvas><p class="note" id="cap"></p></div>
<div class="card"><h2>Datos</h2><div id="form"></div></div></div>
<div class="col"><div class="card"><h2>Resultados y procedimiento</h2><div id="out"><p class="note">Introduce los datos y pulsa «Calcular».</p></div></div></div></div></div>
<script>
/*CORE*/
const PU={atm:1,Pa:1/101325,kPa:1000/101325,mmHg:1/760};      // factor: 1 unidad = x atm
const VU={L:1,mL:1e-3,'m³':1e3};                               // factor: 1 unidad = x L
const UNITS={P:Object.keys(PU),V:Object.keys(VU),T:['K','°C']};
const BASE={P:'atm',V:'L',T:'K'},SUB=['','₁','₂'],NAMES={P:'La presión',V:'El volumen',T:'La temperatura'};
const sym=id=>id[0]+SUB[+id[1]];
function fmt(x){if(x===0)return'0';const a=Math.abs(x);if(a>=1e7||a<1e-4)return x.toExponential(4).replace('e+','×10^').replace('e','×10^');return String(Number(x.toPrecision(6)));}
function toBase(k,v,u){return k==='P'?v*PU[u]:k==='V'?v*VU[u]:v;}
function fromBase(k,v,u){return k==='P'?v/PU[u]:k==='V'?v/VU[u]:v;}
function parseNum(s,label){s=String(s==null?'':s).trim().replace(',','.');
 if(s==='')throw new Error(`Falta el valor de ${label}.`);
 if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s))throw new Error(`El valor de ${label} no es numérico.`);
 const x=parseFloat(s);if(!isFinite(x))throw new Error(`El valor de ${label} no es un número finito.`);return x;}
function readVar(k,idx,raw,u){const lab=k+SUB[idx],v=parseNum(raw,lab),b=toBase(k,v,u);
 if(k==='T'){if(b<=0)throw new Error(`La temperatura ${lab} debe ser mayor que cero.`);}
 else if(v<=0)throw new Error(`${NAMES[k]} ${lab} debe ser mayor que cero (se recibió ${fmt(v)} ${u}).`);
 return b;}
const LAWS={
 boyle:{vars:{P:1,V:1},formula:'P₁ × V₁ = P₂ × V₂',consts:'temperatura (T) y cantidad de gas (n)',expl:'A temperatura constante, el producto P × V no cambia: si el volumen disminuye, las partículas chocan más seguido con las paredes y la presión aumenta.'},
 charles:{vars:{V:1,T:-1},formula:'V₁ / T₁ = V₂ / T₂',consts:'presión (P) y cantidad de gas (n)',expl:'A presión constante, el volumen es directamente proporcional a la temperatura absoluta (en kelvin).'},
 gay:{vars:{P:1,T:-1},formula:'P₁ / T₁ = P₂ / T₂',consts:'volumen (V) y cantidad de gas (n)',expl:'A volumen constante, al aumentar la temperatura las partículas se mueven más rápido y la presión aumenta proporcionalmente.'},
 general:{vars:{P:1,V:1,T:-1},formula:'(P₁ × V₁) / T₁ = (P₂ × V₂) / T₂',consts:'cantidad de gas (n)',expl:'Relaciona los cambios simultáneos de P, V y T de una misma cantidad de gas.'}};
function solveLaw(key,unk,inp){
 const L=LAWS[key],ks=Object.keys(L.vars);
 if(!/^[PVT][12]$/.test(unk)||!(unk[0] in L.vars))throw new Error('Elige una variable válida para calcular.');
 const uk=unk[0],us=+unk[1],val={},known=[];
 for(const s of[1,2])for(const k of ks){const id=k+s;if(id===unk)continue;const r=inp[id]||{};
  val[id]=readVar(k,s,r.v,r.u);
  known.push(`${sym(id)} = ${String(r.v).trim()} ${r.u}`+(k!=='T'&&r.u!==BASE[k]?`  →  ${fmt(val[id])} ${BASE[k]}`:''));}
 const e=L.vars[uk],num=[],den=[];
 for(const k of ks){const ex=L.vars[k];(ex>0?num:den).push(k+(3-us));if(k!==uk)(ex>0?den:num).push(k+us);}
 const [N,D]=e<0?[den,num]:[num,den];
 const fr=(f)=>{const n=N.length?N.map(f).join(' × '):'1';return D.length?`${n} / ${D.length>1?'('+D.map(f).join(' × ')+')':f(D[0])}`:n;};
 const pn=N.reduce((a,i)=>a*val[i],1),pd=D.reduce((a,i)=>a*val[i],1);
 if(!isFinite(pn)||!isFinite(pd)||pd===0)throw new Error('División entre cero o resultado indefinido.');
 const r=pn/pd;if(!isFinite(r)||r<=0)throw new Error('El resultado no es un valor físico válido.');
 const unit=(inp[unk]&&inp[unk].u)||BASE[uk],out=fromBase(uk,r,unit);
 const st={1:{},2:{}};for(const s of[1,2])for(const k of ks)st[s][k]=(k+s===unk)?r:val[k+s];
 const cambios=ks.map(k=>{const q=st[2][k]/st[1][k];return `${NAMES[k].toLowerCase().replace('la ','la ').replace('el ','el ')} ${q>1?'aumenta':q<1?'disminuye':'no cambia'} (factor ${fmt(q)})`;}).join('; ');
 const steps=[
  ['1. Datos conocidos',known.join('\n')],
  ['2. Variable desconocida',`${sym(unk)} (${NAMES[uk].toLowerCase().slice(3)})`],
  ['3. Fórmula',L.formula+`\nConstantes: ${L.consts}.`],
  ['4. Despeje algebraico',`${sym(unk)} = ${fr(sym)}`],
  ['5. Sustitución con unidades',`${sym(unk)} = ${fr(i=>fmt(val[i])+' '+(i[0]==='T'?inp[i].u:BASE[i[0]]))}`],
  ['6. Operaciones',`${sym(unk)} = ${fmt(pn)} / ${fmt(pd)} = ${fmt(r)} ${BASE[uk]}`],
  ['7. Resultado final',`${sym(unk)} = ${fmt(out)} ${unit}`+(unit!==BASE[uk]?`   (${fmt(r)} ${BASE[uk]} convertido a ${unit})`:'')],
  ['8. Interpretación',`${L.expl}\nDel estado 1 al 2: ${cambios}.`]];
 return{value:out,unit,base:r,steps,st,id:unk,expl:L.expl};}
function dalton(mode,gases,pt,pu){
 if(gases.length<2)throw new Error('Agrega al menos dos gases a la mezcla.');
 const nm=gases.map((g,i)=>(g.name||'').trim()||`Gas ${i+1}`);
 const vals=gases.map((g,i)=>{const x=parseNum(g.v,(mode==='moles'?'los moles de ':'la presión parcial de ')+nm[i]);if(x<=0)throw new Error(`${nm[i]}: el valor debe ser mayor que cero.`);return x;});
 let rows,Pt,unit,steps=[];
 if(mode==='moles'){const x=parseNum(pt.v,'la presión total');if(x<=0)throw new Error('La presión total debe ser mayor que cero.');
  Pt=x*PU[pt.u];unit=pt.u;const nt=vals.reduce((a,b)=>a+b,0);
  rows=vals.map((n,i)=>({name:nm[i],n,X:n/nt,P:n/nt*Pt}));
  steps=[['1. Datos conocidos',rows.map(r=>`n(${r.name}) = ${fmt(r.n)} mol`).join('\n')+`\nPtotal = ${fmt(x)} ${pt.u}`+(pt.u!=='atm'?` → ${fmt(Pt)} atm`:'')],
   ['2. Variable desconocida','Xi y Pi de cada gas'],['3. Fórmula','Xi = ni / ntotal\nPi = Xi × Ptotal\nPtotal = P₁ + P₂ + P₃ + …'],
   ['4. Despeje algebraico','Pi = (ni / ntotal) × Ptotal'],
   ['5. Sustitución con unidades',`ntotal = ${vals.map(fmt).join(' + ')} = ${fmt(nt)} mol\n`+rows.map(r=>`P(${r.name}) = (${fmt(r.n)} mol / ${fmt(nt)} mol) × ${fmt(Pt)} atm`).join('\n')],
   ['6. Operaciones',rows.map(r=>`X(${r.name}) = ${fmt(r.X)};  P(${r.name}) = ${fmt(r.X)} × ${fmt(Pt)} = ${fmt(r.P)} atm`).join('\n')]];
 }else{const ps=vals.map(v=>v*PU[pu]),sumPs=ps.reduce((a,b)=>a+b,0);Pt=sumPs/2;unit=pu;
  rows=ps.map((p,i)=>({name:nm[i],P:p,X:p/sumPs}));
  steps=[['1. Datos conocidos',gases.map((g,i)=>`P(${nm[i]}) = ${fmt(vals[i])} ${pu}`+(pu!=='atm'?` → ${fmt(ps[i])} atm`:'')).join('\n')],
   ['2. Variable desconocida','Ptotal y Xi'],['3. Fórmula','Ptotal = P₁ + P₂ + P₃ + …\nXi = Pi / Ptotal'],['4. Despeje algebraico','Ptotal = Σ Pi'],
   ['5. Sustitución con unidades','Ptotal = '+ps.map(p=>fmt(p)+' atm').join(' + ')],['6. Operaciones',`Ptotal = ${fmt(Pt)} atm\n`+rows.map(r=>`X(${r.name}) = ${fmt(r.P)} / ${fmt(Pt)} = ${fmt(r.X)}`).join('\n')]];}
 const sP=rows.reduce((a,r)=>a+r.P,0),sX=rows.reduce((a,r)=>a+r.X,0);
 if((mode==='moles'&&Math.abs(sP-Pt)>1e-9*Pt)||Math.abs(sX-1)>1e-9)throw new Error('Error interno de coherencia: datos de la mezcla no válidos.');
 const Ptd=Pt/PU[unit];
 steps.push(['7. Resultado final',`Ptotal = ${fmt(Ptd)} ${unit}\n`+rows.map(r=>`X(${r.name}) = ${fmt(r.X)};  P(${r.name}) = ${fmt(r.P/PU[unit])} ${unit}`).join('\n')+`\nΣXi = ${fmt(sX)}`],
  ['8. Interpretación','La presión total es la suma de las presiones parciales: cada gas ejerce la presión que tendría si ocupara solo el recipiente, proporcional a su fracción molar.']);
 return{rows,Pt,Ptd,unit,steps,PU};}
const ATM={P0:101325,T0:288.15,L:0.0065,g:10,M:0.0289644,R:8.31446};
function altitude(hs){const h=parseNum(hs,'la altitud');
 if(h<0||h>11000)throw new Error('La altitud debe estar entre 0 y 11 000 m: el modelo solo es válido en la troposfera.');
 const{P0,T0,L,g,M,R}=ATM,b=1-L*h/T0,ex=g*M/(R*L);
 if(!(b>0))throw new Error('Resultado indefinido para esa altitud.');
 const P=P0*Math.pow(b,ex),atm=P/101325,mm=atm*760,pct=P/P0*100;
 const steps=[['1. Datos conocidos',`h = ${fmt(h)} m\nP₀ = 101325 Pa, T₀ = 288.15 K, L = 0.0065 K/m, g = 10 m/s², M = 0.0289644 kg/mol, R = 8.31446 J/(mol·K)`],
  ['2. Variable desconocida','P (presión atmosférica a la altitud h)'],['3. Fórmula','P = P₀ × (1 − L·h/T₀)^(g·M/(R·L))'],
  ['4. Despeje algebraico','P ya está despejada; se evalúa base y exponente por separado.'],
  ['5. Sustitución con unidades',`base = 1 − (0.0065 K/m × ${fmt(h)} m) / 288.15 K\nexponente = (10 × 0.0289644) / (8.31446 × 0.0065)`],
  ['6. Operaciones',`base = ${fmt(b)} (adimensional)\nexponente = ${fmt(ex)}\nP = 101325 × ${fmt(b)}^${fmt(ex)} = ${fmt(P)} Pa`],
  ['7. Resultado final',`P = ${fmt(P)} Pa = ${fmt(P/1000)} kPa = ${fmt(atm)} atm = ${fmt(mm)} mmHg\nEquivale a ${fmt(pct)} % de la presión a nivel del mar (${fmt(100-pct)} % menos)`],
  ['8. Interpretación','La presión es el peso de la columna de aire sobre ti. A mayor altitud hay menos aire encima y el aire es menos denso, por eso la presión baja. Es una estimación con atmósfera estándar, no una medición meteorológica.']];
 return{P,atm,mm,pct,steps,h};}
/*ENDCORE*/

/* ===== Interfaz ===== */
const EXPS=[{id:'boyle',n:'1. Ley de Boyle',c:'#2563eb'},{id:'charles',n:'2. Ley de Charles',c:'#e07a1f'},{id:'gay',n:'3. Ley de Gay-Lussac',c:'#c62f4b'},{id:'general',n:'4. Ecuación general',c:'#7c3aed'},{id:'dalton',n:'5. Ley de Dalton',c:'#0f9d8a'},{id:'alt',n:'6. Altitud en Colombia',c:'#5a8f29'}];
const CITIES={Bogotá:2640,Medellín:1495,Cali:1018,Barranquilla:18,Cartagena:2};
const EX={boyle:{P1:2,V1:3,V2:1.5,u:'P2'},charles:{V1:2,T1:300,T2:450,u:'V2'},gay:{P1:1,T1:300,T2:360,u:'P2'},general:{P1:1,V1:2,T1:300,P2:2,V2:1.5,u:'T2'}};
const PAL=['#2563eb','#e07a1f','#c62f4b','#0f9d8a','#7c3aed','#a3a300'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let exp='boyle',mode='guided',gases=[{name:'N₂',v:''},{name:'O₂',v:''}];
const lab={cur:{vol:1,spd:.6,p:.5,n:40},tgt:{vol:1,spd:.6,p:.5,n:40},piston:true,cols:[PAL[0]]};
$('#menu').innerHTML=EXPS.map(e=>`<button data-e="${e.id}" style="--k:${e.c}">${e.n}</button>`).join('');
$('#menu').onclick=e=>{const b=e.target.closest('button');if(b){exp=b.dataset.e;render();}};
$('#modes').onclick=e=>{const b=e.target.closest('button');if(b){mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));render();}};
const unitSel=(id,k,sel)=>`<select id="u${id}" aria-label="Unidad">${UNITS[k].map(u=>`<option${u===(sel||BASE[k])?' selected':''}>${u}</option>`).join('')}</select>`;
function render(){const E=EXPS.find(e=>e.id===exp);document.documentElement.style.setProperty('--c',E.c);
 document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('on',b.dataset.e===exp));
 $('#ttl').textContent=E.n.slice(3);$('#out').innerHTML='<p class="note">Introduce los datos y pulsa «Calcular».</p>';
 lab.piston=['boyle','charles','general'].includes(exp);setLab({vol:1,spd:.6,p:.5,n:40},true);
 $('#cap').textContent=exp==='dalton'?'Cada color representa un gas distinto.':exp==='alt'?'La densidad de partículas representa la presión del aire.':lab.piston?'Pistón móvil: su posición representa el volumen y la rapidez de las partículas representa la temperatura.':'Recipiente rígido: el volumen no cambia; el color de las paredes indica la presión.';
 lab.cols=[E.c];
 if(LAWS[exp])formLaw();else if(exp==='dalton')formDalton();else formAlt();}
function formLaw(){const L=LAWS[exp],ks=Object.keys(L.vars),ids=[];
 for(const s of(mode==='guided'?[2]:[1,2]))for(const k of ks)ids.push(k+s);
 let h=`<p class="const"><b>Constantes:</b> ${L.consts}.<br><b>Ecuación:</b> ${L.formula}</p>
 <label>Variable a calcular<select id="unk">${ids.map(i=>`<option value="${i}">${sym(i)} (${NAMES[i[0]].toLowerCase().slice(3)})</option>`).join('')}</select></label>`;
 for(const s of[1,2]){h+=`<h4>Estado ${s===1?'inicial':'final'}</h4>`;for(const k of ks){const id=k+s;h+=`<div class="row"><label for="i${id}">${sym(id)}</label><input id="i${id}" inputmode="decimal" autocomplete="off">${unitSel(id,k)}</div>`;}}
 $('#form').innerHTML=h+`<button class="go" id="calc">Calcular</button><button class="sm" id="ex">Cargar ejemplo</button>`;
 const upd=()=>{const u=$('#unk').value;for(const s of[1,2])for(const k of ks){const i=$('#i'+k+s);i.disabled=(k+s===u);if(i.disabled){i.value='';i.placeholder='calculado';}else i.placeholder='';}};
 $('#unk').onchange=upd;upd();$('#calc').onclick=calcLaw;
 $('#ex').onclick=()=>{const e=EX[exp];if(mode==='guided'&&e.u[1]==='1')return;$('#unk').value=e.u;upd();
  for(const s of[1,2])for(const k of ks){const i=$('#i'+k+s);if(!i.disabled){i.value=e[k+s];$('#u'+k+s).value=BASE[k];}}};}
function calcLaw(){try{const ks=Object.keys(LAWS[exp].vars),inp={};
 for(const s of[1,2])for(const k of ks)inp[k+s]={v:$('#i'+k+s).value,u:$('#u'+k+s).value};
 const r=solveLaw(exp,$('#unk').value,inp);
 showSteps(r.steps,`<div class="res">${sym(r.id)} = ${fmt(r.value)} ${r.unit}</div>`);
 const a=r.st[1],b=r.st[2],mx=k=>Math.max(a[k]||0,b[k]||0),f=(s,k)=>s[k]?s[k]/mx(k):1;
 const view=s=>({vol:lab.piston&&s.V?Math.max(.3,f(s,'V')):1,spd:s.T?Math.sqrt(s.T/mx('T'))*.9+.1:.6,p:s.P?s.P/mx('P'):.5,n:40});
 setLab(view(a),true);setTimeout(()=>setLab(view(b)),600);
 }catch(e){err(e);}}
function err(e){$('#out').innerHTML=`<div class="err" role="alert">⚠ ${esc(e.message)}</div>`;}
function showSteps(steps,head){$('#out').innerHTML=head+steps.map(s=>`<div class="step"><b>${s[0]}</b><div>${esc(s[1])}</div></div>`).join('');}
function formDalton(){let h=`<p class="const"><b>Ecuaciones:</b> Ptotal = P₁ + P₂ + …;  Pᵢ = Xᵢ × Ptotal</p>
 <label>Datos conocidos<select id="dm"><option value="moles">Moles de cada gas + presión total</option><option value="parciales">Presión parcial de cada gas</option></select></label><div id="gl"></div>
 <button class="sm" id="add">+ Agregar gas</button><button class="sm" id="del">− Quitar gas</button><div id="ptw"><h4>Presión total</h4><div class="row"><label for="pt">Ptotal</label><input id="pt" inputmode="decimal">${unitSel('pt','P')}</div></div>
 <div id="pw" style="display:none"><h4>Unidad de las presiones</h4>${unitSel('pp','P')}</div><button class="go" id="calc">Calcular</button><button class="sm" id="ex">Cargar ejemplo</button>`;
 $('#form').innerHTML=h;const draw=()=>{const m=$('#dm').value;$('#gl').innerHTML=gases.map((g,i)=>`<div class="row g"><input aria-label="Nombre del gas" id="gn${i}" value="${esc(g.name)}"><input id="gv${i}" inputmode="decimal" placeholder="${m==='moles'?'mol':'presión'}" value="${esc(g.v)}"><span style="color:${PAL[i%6]}">●</span></div>`).join('');
  $('#ptw').style.display=m==='moles'?'':'none';$('#pw').style.display=m==='moles'?'none':'';};
 const sv=()=>gases.forEach((g,i)=>{g.name=$('#gn'+i).value;g.v=$('#gv'+i).value;});
 $('#dm').onchange=()=>{sv();draw();};$('#add').onclick=()=>{sv();if(gases.length<6)gases.push({name:'Gas '+(gases.length+1),v:''});draw();};
 $('#del').onclick=()=>{sv();if(gases.length>2)gases.pop();draw();};draw();
 $('#ex').onclick=()=>{gases=[{name:'N₂',v:'3'},{name:'O₂',v:'1'}];$('#dm').value='moles';draw();$('#pt').value='2';$('#upt').value='atm';};
 $('#calc').onclick=()=>{try{sv();const m=$('#dm').value;
  const r=dalton(m,gases,{v:$('#pt').value,u:$('#upt').value},$('#upp').value);
  const tb=`<table><tr><th>Gas</th><th>Xᵢ</th><th>Pᵢ (${r.unit})</th></tr>${r.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.X)}</td><td>${fmt(x.P/PU[r.unit])}</td></tr>`).join('')}</table>`;
  showSteps(r.steps,`<div class="res">Ptotal = ${fmt(r.Ptd)} ${r.unit}</div>${tb}`);
  lab.cols=r.rows.map((_,i)=>PAL[i%6]);lab.counts=r.rows.map(x=>Math.max(2,Math.round(x.X*60)));setLab({vol:1,spd:.6,p:.5,n:lab.counts.reduce((a,b)=>a+b,0)},true);
 }catch(e){err(e);}};}
function formAlt(){$('#form').innerHTML=`<p class="const"><b>Modelo:</b> atmósfera estándar en la troposfera (0 a 11 000 m).</p>
 <label>Ciudad<select id="city">${Object.keys(CITIES).map(c=>`<option>${c}</option>`).join('')}<option value="">Altitud personalizada</option></select></label>
 <div class="row" style="grid-template-columns:70px 1fr 40px"><label for="h">Altitud</label><input id="h" inputmode="decimal"><span>m</span></div>
 <p class="note">Las altitudes de las ciudades son valores de referencia aproximados (Bogotá 2640 m, Medellín 1495 m, Cali 1018 m, Barranquilla 18 m, Cartagena 2 m).</p>
 <button class="go" id="calc">Calcular</button>`;
 const upd=()=>{const c=$('#city').value;$('#h').disabled=!!c;if(c)$('#h').value=CITIES[c];else{$('#h').value='';}};$('#city').onchange=upd;upd();
 $('#calc').onclick=()=>{try{const r=altitude($('#h').value),c=$('#city').value||'Altitud personalizada';
  showSteps(r.steps,`<div class="res">${esc(c)}: ${fmt(r.P)} Pa = ${fmt(r.atm)} atm</div><p>Altitud: ${fmt(r.h)} m · Nivel del mar: 101325 Pa (1 atm) · Relación: ${fmt(r.pct)} %</p><p class="note">Estimación basada en una atmósfera estándar, no una medición meteorológica real.</p>`);
  setLab({vol:1,spd:.6,p:r.pct/100,n:Math.max(4,Math.round(60*r.pct/100))},true);}catch(e){err(e);}};}

/* ===== Laboratorio visual (solo ilustrativo: no interviene en los cálculos) ===== */
const cv=$('#cv'),cx=cv.getContext('2d'),W=cv.width,H=cv.height;let parts=[];
function setLab(t,snap){Object.assign(lab.tgt,t);if(snap){Object.assign(lab.cur,t);}
 if(parts.length!==lab.tgt.n||snap){parts=[];const cs=lab.cols,cn=lab.counts&&exp==='dalton'?lab.counts:[lab.tgt.n];
  cn.forEach((c,gi)=>{for(let i=0;i<c;i++)parts.push({x:60+Math.random()*(W-120),y:100+Math.random()*180,a:Math.random()*6.28,c:cs[gi%cs.length]});});}}
function frame(){const c=lab.cur,t=lab.tgt;for(const k of['vol','spd','p'])c[k]+=(t[k]-c[k])*.05;
 const L=30,R=W-30,B=H-20,top0=40,top=B-(B-top0-20)*c.vol-0;cx.clearRect(0,0,W,H);
 cx.fillStyle=`hsla(${5},80%,${92-c.p*35}%,.7)`;cx.fillRect(L,top,R-L,B-top);
 cx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--c')||'#333';cx.lineWidth=5;cx.strokeRect(L,top,R-L,B-top);
 cx.fillStyle='#667';if(lab.piston){cx.fillRect(L,top-12,R-L,12);cx.fillRect(W/2-5,10,10,top-20);cx.fillRect(W/2-30,4,60,8);}
 for(const p of parts){const v=1.2+c.spd*3.2;p.x+=Math.cos(p.a)*v;p.y+=Math.sin(p.a)*v;
  if(p.x<L+5){p.x=L+5;p.a=Math.PI-p.a;}if(p.x>R-5){p.x=R-5;p.a=Math.PI-p.a;}
  if(p.y<top+5){p.y=top+5;p.a=-p.a;}if(p.y>B-5){p.y=B-5;p.a=-p.a;}
  cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,5,0,6.283);cx.fill();}
 requestAnimationFrame(frame);}
render();frame();
</script></body></html>
